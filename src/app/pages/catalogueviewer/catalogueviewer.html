
<div class="catalogue-card">

  <!-- Header -->
  <div class="catalogue-header">
    <div>
      <h5 class="catalogue-title">
        {{ catalogueTitle() }}
      </h5>

      <p class="catalogue-subtitle">
        {{ totalItems() }} registros encontrados
      </p>
    </div>

    <div class="catalogue-actions d-flex align-items-center gap-2">

@if(create()){
        <button
        type="button"
        class="btn btn-primary btn-sm d-inline-flex align-items-center justify-content-center"
        title="Nuevo registro"
        aria-label="Nuevo registro"
        (click)="createRecord()">

        <i class="bi bi-plus-lg"></i>

      </button>
}

      <label class="page-size-label mb-0">
        Mostrar
      </label>

      <select
        class="form-select form-select-sm page-size-select"
        [value]="pageSize()"
        (change)="changePageSize($any($event.target).value)">

        <option
          *ngFor="let size of pageSizeOptions"
          [value]="size">

          {{ size }}

        </option>

      </select>

    </div>
  </div>

  <!-- Table -->
  <div
    class="table-responsive catalogue-table-wrapper"
    *ngIf="catalogueData().length > 0">

    <table class="table catalogue-table align-middle">

      <thead>
        <tr>

          <th *ngFor="let column of catalogueCaptions()">
            {{ column }}
          </th>

          <th class="text-center">
            Acciones
          </th>

        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let row of paginatedData()">

          <td *ngFor="let column of catalogueColumns()">

            <ng-container [ngSwitch]="row[column]">

              <span
                *ngSwitchCase="true"
                class="badge bg-success-subtle text-success">
                Activo
              </span>

              <span
                *ngSwitchCase="false"
                class="badge bg-danger-subtle text-danger">
                Inactivo
              </span>

              <span
                *ngSwitchCase="null"
                class="text-muted">
                -
              </span>

              <span
                *ngSwitchCase="''"
                class="text-muted">
                -
              </span>

              <span *ngSwitchDefault>
                {{ row[column] }}
              </span>

            </ng-container>

          </td>

          <!-- Acciones -->
          <td class="text-center">

            <div class="d-flex justify-content-center align-items-center gap-2">

@if(update()){
                <button
                type="button"
                class="btn btn-outline-primary btn-sm d-inline-flex align-items-center justify-content-center"
                title="Editar registro"
                aria-label="Editar registro"
                (click)="editRecord(row)">

                <i class="bi bi-pencil-square"></i>

              </button>

}

@if(delete()){
              <button
                type="button"
                class="btn btn-outline-danger btn-sm d-inline-flex align-items-center justify-content-center"
                title="Eliminar registro"
                aria-label="Eliminar registro"
                (click)="deleteRecord(row)">

                <i class="bi bi-trash3"></i>

              </button>
}

            </div>

          </td>

        </tr>

      </tbody>

    </table>
  </div>

  <!-- Footer pager -->
  <div
    class="catalogue-footer"
    *ngIf="catalogueData().length > 0">

    <div class="pager-info">
      Mostrando
      {{ startItem() }}
      -
      {{ endItem() }}
      de {{ totalItems() }}
    </div>

    <nav aria-label="Paginación de catálogo">

      <ul class="pagination pagination-sm mb-0">

        <li
          class="page-item"
          [class.disabled]="currentPage() === 1">

          <button
            class="page-link"
            type="button"
            [disabled]="currentPage() === 1"
            (click)="previousPage()">

            <i class="bi bi-chevron-left"></i>
            Anterior

          </button>

        </li>

        <li
          class="page-item"
          *ngFor="let page of pages()"
          [class.active]="page === currentPage()">

          <button
            class="page-link"
            type="button"
            (click)="goToPage(page)">

            {{ page }}

          </button>

        </li>

        <li
          class="page-item"
          [class.disabled]="currentPage() === totalPages()">

          <button
            class="page-link"
            type="button"
            [disabled]="currentPage() === totalPages()"
            (click)="nextPage()">

            Siguiente
            <i class="bi bi-chevron-right"></i>

          </button>

        </li>

      </ul>

    </nav>

  </div>

  <!-- Empty state -->
  <div
    class="empty-state"
    *ngIf="catalogueData().length === 0">

    <i class="bi bi-inbox me-2"></i>
    No hay datos para mostrar.

  </div>

</div>

<app-catalogue-form-modal
[visible]="formModalVisible()"
[mode]="formMode()"
[config]="formConfig()"
[record]="selectedRecord()"
(closeModal)="closeFormModal()"
(saveRecord)="saveCatalogueRecord($event)"
>

</app-catalogue-form-modal>
