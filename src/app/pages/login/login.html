<div class="login-page d-flex align-items-center justify-content-center">

  <div class="login-card container-fluid">

    <div class="row h-100">

      <!-- Branding -->
      <div class="col-12 col-md-6 d-flex align-items-center justify-content-center text-center brand-section">
        <div>
          <h1 class="brand-title">geeks-iot-cloud</h1>
          <p class="brand-subtitle">
            Plataforma corporativa de monitoreo e integración IoT
          </p>

          <button type="button" class="btn btn-outline-light rounded-pill px-4">
            Crear nueva cuenta
          </button>
        </div>
      </div>

      <!-- Login -->
      <div class="col-12 col-md-6 d-flex align-items-center justify-content-center form-section">

        <form class="login-form w-100">

          <h2 class="text-white mb-4">Iniciar sesión</h2>

          <div class="mb-3">
            <input
              type="email"
              class="form-control login-input"
              placeholder="Usuario"
              autocomplete="username"
              name="name"
              [(ngModel)]="user"
            />
          </div>

          <div class="mb-3">
            <input
              type="password"
              class="form-control login-input"
              placeholder="Contraseña"
              autocomplete="current-password"
              name="password"
              [(ngModel)]="password"
            />
          </div>

          <div class="d-flex justify-content-between align-items-center mt-2">
            <a href="#" class="forgot-link">
              ¿Olvidaste tu contraseña?
            </a>

            <button type="submit" class="btn btn-login" (click)="login()">
              Entrar
              <span>›</span>
            </button>
          </div>

        </form>

      </div>

    </div>

    <div class="login-footer">
      <a href="#">Acerca de</a>
      <span>|</span>
      <a href="#">Contacto</a>
      <span>|</span>
      <a href="#">Ayuda</a>
    </div>
    
  </div>

</div>
