<div class="login-page">

  <div class="login-card">

    <div class="row g-0 h-100">

      <!-- BRANDING -->
      <div class="col-12 col-md-6 brand-section">

        <div class="brand-content">

          <h1 class="brand-name">
            geeks-<span>iot</span>-cloud
          </h1>

          <p class="brand-subtitle">
            Plataforma corporativa de monitoreo e integración IoT
          </p>

          <button
            type="button"
            class="btn btn-outline-light rounded-pill px-4"
            (click)="openRegisteruser()"
          >
            Crear nueva cuenta
          </button>

        </div>

      </div>


      <!-- LOGIN -->
      <div class="col-12 col-md-6 form-section">

        <form
          class="login-form"
          (ngSubmit)="login()"
        >

          <h2 class="login-title">
            Iniciar sesión
          </h2>

          <div class="mb-3">

            <input
              type="email"
              class="form-control login-input"
              placeholder="Usuario"
              autocomplete="username"
              name="name"
              [(ngModel)]="user"
            />

          </div>

    <div class="mb-3 password-container">

  <input
    [type]="showPassword ? 'text' : 'password'"
    class="form-control login-input"
    placeholder="Contraseña"
    autocomplete="current-password"
    name="password"
    [(ngModel)]="password"
  />

  <button
    type="button"
    class="password-toggle"
    (click)="togglePassword()"
    [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
  >
    <i
      class="bi"
      [class.bi-eye]="!showPassword"
      [class.bi-eye-slash]="showPassword"
    ></i>
  </button>

</div>

      <button
  type="submit"
  class="btn btn-login"
>
  <span class="btn-login-text">Entrar</span>

  <i class="bi bi-arrow-right-short btn-login-icon"></i>
</button>

        </form>

      </div>

    </div>


    <!-- FOOTER -->
    <div class="login-footer">

      <a href="#">Acerca de</a>
      <span>|</span>

      <a href="#">Contacto</a>
      <span>|</span>

      <a href="#">Ayuda</a>

    </div>

  </div>

</div>
